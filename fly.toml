# fly.toml app configuration file generated for deflect-duels on 2026-10-26T15:51:12Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'deflect-duels'
primary_region = 'yyz'

[build]

[env]
  DATA_DIR = '/data'
  PORT = '8080'
  ROAMERS = '4'

[[mounts]]
  source = 'deflect_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 500
    soft_limit = 400

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
