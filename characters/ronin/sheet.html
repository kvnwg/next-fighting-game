<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Ronin Voxel Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;800&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet" />
<script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>
<style>
  :root { --paper: #f3f0e9; --ink: #141416; --muted: #6d6a64; --rule: #d4cfc4; }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--paper); color: var(--ink); font-family: 'Cormorant Garamond', Georgia, serif; }
  #sheet { width: 2560px; padding: 56px 72px 48px; background: var(--paper); }
  header { display: flex; align-items: baseline; gap: 28px; border-bottom: 2px solid var(--ink); padding-bottom: 18px; }
  h1 { font-family: 'Shippori Mincho', serif; font-weight: 800; font-size: 92px; letter-spacing: 0.12em; line-height: 1; }
  .kanji { font-family: 'Shippori Mincho', serif; font-size: 64px; font-weight: 800; }
  .meta { margin-left: auto; text-align: right; font-size: 26px; color: var(--muted); line-height: 1.35; }
  .panels { display: flex; align-items: flex-end; justify-content: space-between; margin-top: 30px; }
  figure { display: flex; flex-direction: column; align-items: center; }
  figcaption { margin-top: 10px; font-size: 30px; letter-spacing: 0.22em; text-transform: uppercase; font-weight: 600; }
  figcaption small { display: block; text-align: center; font-size: 20px; letter-spacing: 0.1em; color: var(--muted); text-transform: none; font-weight: 500; }
  footer { display: flex; align-items: center; gap: 36px; margin-top: 26px; border-top: 1px solid var(--rule); padding-top: 18px; }
  .swatches { display: flex; flex-wrap: wrap; gap: 6px; }
  .swatch { width: 34px; height: 34px; border: 1px solid rgba(0,0,0,0.25); }
  footer p { font-size: 22px; color: var(--muted); max-width: 900px; line-height: 1.35; }
  footer .label { font-size: 22px; letter-spacing: 0.2em; text-transform: uppercase; font-weight: 600; color: var(--ink); }
</style>
</head>
<body>
<div id="sheet">
  <header>
    <h1>RONIN</h1><span class="kanji">浪人</span>
    <div class="meta" id="meta"></div>
  </header>
  <div class="panels" id="panels"></div>
  <footer>
    <span class="label">Palette</span>
    <div class="swatches" id="swatches"></div>
    <p>Straw kasa, long robe over hakama, katana &amp; wakizashi through the obi, sheathed polearm across the back. Kept to the ink-wash greys of the reference.</p>
  </footer>
</div>
<script type="module">
  import * as THREE from 'three';
  import { buildRonin, poses, palette } from './model.js';
  import { buildRig } from '../../tools/voxel/mesher.js';

  const PX = 9; // pixels per voxel on the sheet
  const Y0 = -3, Y1 = 91;

  const model = buildRonin();
  const rig = buildRig(model);
  const scene = new THREE.Scene();
  scene.add(rig.root);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8780, 2.1));
  const key = new THREE.DirectionalLight(0xffffff, 2.2);
  const fill = new THREE.DirectionalLight(0xffffff, 0.6);
  scene.add(key, key.target, fill, fill.target);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.setClearColor(0x000000, 0);

  const views = [
    { id: 'tpose', title: 'T-Pose', sub: 'front', pose: 'tpose', dir: [0, 0, 1], x: [-40, 40] },
    { id: 'apose', title: 'A-Pose', sub: 'front', pose: 'apose', dir: [0, 0, 1], x: [-33, 33] },
    { id: 'side', title: 'Side', sub: 'left profile · A-pose', pose: 'apose', dir: [1, 0, 0], x: [-20, 26] },
    { id: 'back', title: 'Back', sub: 'A-pose', pose: 'apose', dir: [0, 0, -1], x: [-33, 33] },
  ];

  // deterministic ink-wash splatter behind each figure, like the reference art
  function splatter(ctx, w, h, seed) {
    let s = seed;
    const rnd = () => ((s = (s * 16807) % 2147483647) / 2147483647);
    // keep every mark (and its radius) inside the canvas so nothing is clipped
    const dot = (x, y, r, a) => {
      if (x - r < 4 || x + r > w - 4 || y - r < 4 || y + r > h - 4) return;
      ctx.fillStyle = `rgba(18,18,20,${a})`; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
    };
    const cx = w * (0.6 + rnd() * 0.08), cy = h * 0.6;
    // washes: clusters of overlapping translucent blots give soft, irregular edges
    for (let i = 0; i < 9; i++) {
      const bx = cx + (rnd() - 0.4) * w * 0.55, by = cy + (rnd() - 0.5) * h * 0.45;
      const br = 30 + rnd() * 70;
      for (let j = 0; j < 40; j++) {
        const a = rnd() * 7, d = Math.sqrt(rnd()) * br;
        dot(bx + Math.cos(a) * d, by + Math.sin(a) * d * 0.9, 4 + rnd() * br * 0.35, 0.012 + rnd() * 0.02);
      }
    }
    // spray: sharp droplets thrown outward from the washes
    for (let i = 0; i < 260; i++) {
      const a = rnd() * 7, d = Math.pow(rnd(), 0.7) * w * 0.48;
      const r = 0.8 + Math.pow(rnd(), 3) * 9;
      dot(cx + Math.cos(a) * d, cy + Math.sin(a) * d * 0.95, r, 0.35 + rnd() * 0.5);
    }
  }

  const panels = document.getElementById('panels');
  for (const [i, v] of views.entries()) {
    const w = (v.x[1] - v.x[0]) * PX, h = (Y1 - Y0) * PX;
    const fig = document.createElement('figure');
    fig.id = `panel-${v.id}`;
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    canvas.id = `view-${v.id}`;
    fig.append(canvas);
    fig.insertAdjacentHTML('beforeend', `<figcaption>${v.title}<small>${v.sub}</small></figcaption>`);
    panels.append(fig);

    rig.setPose(poses[v.pose]);
    const cam = new THREE.OrthographicCamera(v.x[0], v.x[1], Y1, Y0, 1, 1000);
    const [dx, , dz] = v.dir;
    // horizontal extent is measured in the camera's own right axis
    cam.position.set(dx * 300, 0, dz * 300);
    cam.lookAt(0, 0, 0);
    cam.left = v.x[0]; cam.right = v.x[1]; cam.top = Y1; cam.bottom = Y0;
    cam.updateProjectionMatrix();
    const right = new THREE.Vector3(1, 0, 0).applyQuaternion(cam.quaternion);
    key.position.set(dx * 60 - right.x * 45, 110, dz * 60 - right.z * 45);
    fill.position.set(dx * 40 + right.x * 60, 20, dz * 40 + right.z * 60);

    renderer.setSize(w, h, false);
    renderer.render(scene, cam);

    const ctx = canvas.getContext('2d');
    splatter(ctx, w, h, 1234 + i * 97);
    // ground shadow
    const gy = (Y1 - 0) * PX;
    const grad = ctx.createRadialGradient(w / 2, gy, 2, w / 2, gy, 150);
    grad.addColorStop(0, 'rgba(0,0,0,0.28)'); grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.save(); ctx.scale(1, 0.18); ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(w / 2, gy / 0.18, 150, 0, 7); ctx.fill(); ctx.restore();
    ctx.drawImage(renderer.domElement, 0, 0);
  }

  const height = model.bounds.max[1] - model.bounds.min[1] + 1;
  const dims = model.bounds.max.map((m, i) => m - model.bounds.min[i] + 1);
  document.getElementById('meta').innerHTML =
    `Voxel character sheet<br>${model.voxels.length.toLocaleString()} voxels · ${model.bones.length} bones · ${height} vx tall incl. polearm<br>1 voxel ≈ 2.25 cm · T-pose bounds ${dims.join(' × ')}`;
  document.getElementById('swatches').innerHTML = Object.entries(palette)
    .map(([k, c]) => `<div class="swatch" title="${k}" style="background:${c}"></div>`).join('');

  await document.fonts.ready;
  window.__ready = true;
</script>
</body>
</html>
