# Deploys the game server to Fly.io on every push to main (and on demand from the Actions tab).
# Needs a FLY_API_TOKEN repository secret (`fly tokens create deploy`); until there is one, it
# says so and stops. See DEPLOY.md.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# one deploy at a time; a newer push waits for the one before it
concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Needs a Fly token
        if: env.FLY_API_TOKEN == ''
        run: echo "::notice::Add a FLY_API_TOKEN repository secret to deploy from here (see DEPLOY.md)."
      - uses: actions/checkout@v4
        if: env.FLY_API_TOKEN != ''
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: env.FLY_API_TOKEN != ''
      - run: flyctl deploy --remote-only
        if: env.FLY_API_TOKEN != ''
