# Deploys the game server to Fly.io when CI passes on main (and on demand from the Actions tab).
# Needs a FLY_API_TOKEN repository secret (`fly tokens create deploy`); until there is one, it
# says so and stops. See DEPLOY.md.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# one deploy at a time; a newer one waits for the one before it
concurrency: deploy

jobs:
  deploy:
    # only a push to main whose checks passed (a red build never restarts the server)
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Needs a Fly token
        if: env.FLY_API_TOKEN == ''
        run: echo "::notice::Add a FLY_API_TOKEN repository secret to deploy from here (see DEPLOY.md)."
      - uses: actions/checkout@v4
        if: env.FLY_API_TOKEN != ''
        with:
          # the commit CI checked, not whatever main is by now
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: env.FLY_API_TOKEN != ''
      - run: flyctl deploy --remote-only
        if: env.FLY_API_TOKEN != ''
