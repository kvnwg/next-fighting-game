<!doctype html>
<html><head><meta charset="utf-8"><title>Portraits</title>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }</script>
</head><body style="margin:0;background:transparent">
<canvas id="c" width="320" height="320"></canvas>
<script type="module">
  // Renders a 3/4 head-and-shoulders portrait of each fighter on a transparent background.
  import * as THREE from 'three';
  import { buildRig } from './mesher.js';

  const FIGHTERS = ['ronin', 'warden', 'wraith', 'lancer', 'assassin', 'duelist', 'monk', 'knight'];
  const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.setClearColor(0x000000, 0);
  const out = {};
  for (const id of FIGHTERS) {
    const mod = await import(`../../characters/${id}/model.js`);
    const build = Object.entries(mod).find(([k]) => k === 'build' + id[0].toUpperCase() + id.slice(1))[1];
    const model = build();
    const rig = buildRig(model);
    rig.setPose(mod.poses.apose);
    const scene = new THREE.Scene();
    scene.add(rig.root);
    scene.add(new THREE.HemisphereLight(0xffffff, 0x6d6a78, 2.0));
    const key = new THREE.DirectionalLight(0xffffff, 2.4);
    key.position.set(60, 120, 120);
    scene.add(key);
    const rim = new THREE.DirectionalLight(0xb9c4ff, 1.4);
    rim.position.set(-120, 60, -80);
    scene.add(rim);
    const head = model.bones.find((b) => b.name === 'head').pivot;
    const height = model.bounds.max[1] - model.bounds.min[1];
    const look = new THREE.Vector3(0, head[1] - height * 0.03, head[2]);
    const cam = new THREE.PerspectiveCamera(30, 1, 1, 2000);
    const dist = height * 0.82;
    cam.position.set(look.x + dist * 0.42, look.y + height * 0.05, look.z + dist * 0.9);
    cam.lookAt(look);
    renderer.render(scene, cam);
    out[id] = renderer.domElement.toDataURL('image/png');
  }
  window.__portraits = out;
</script></body></html>
